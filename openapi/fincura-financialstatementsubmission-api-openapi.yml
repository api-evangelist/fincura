openapi: 3.2.0
info:
  title: Automated Spreading and Analysis Financial Statement…
  version: 1.3.1
  description: This REST API allows you to interact with the Automated Spreading processing and insights engine.
  x-logo:
    url: https://manual-public-web-static-resources.s3.amazonaws.com/public-api/Moodys-icon.svg
  contact:
    name: Moody's Automated Spreading Customer Support
    email: MA_NMR_Support@moodys.com
security:
- API_Key: []
tags:
- name: FinancialStatementSubmission
paths:
  /v1/financial-statement-submission:
    post:
      operationId: createFinancialStatementSubmission
      description: Submit structured financial statement data (JSON body); file is stored in S3 and processing is queued.
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinancialStatementSubmission'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FinancialStatementSubmission'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FinancialStatementSubmission'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinancialStatementSubmission'
          description: ''
      tags:
      - FinancialStatementSubmission
      summary: Submit structured financial statements (JSON)
components:
  schemas:
    FinancialStatementSubmission:
      type: object
      properties:
        schema_version:
          type: string
        company_id:
          type:
          - integer
          - 'null'
        company_uuid:
          type:
          - string
          - 'null'
          format: uuid
        external_company_id:
          type: string
          description: External ID is used to uniquely identify a record from your system in our system. Must be unique across records.
          maxLength: 255
        currency:
          type: string
          default: USD
        multiply_by_factor:
          type:
          - object
          - 'null'
        spreading_template_id:
          type:
          - integer
          - 'null'
        original_document_name:
          type:
          - string
          - 'null'
        push_to_completion:
          type: boolean
          default: false
        statements:
          type: array
          items:
            type: object
            properties:
              statement_type:
                enum:
                - INCOME_STATEMENT
                - BALANCE_SHEET
                - CASH_FLOW_STATEMENT
                type: string
              columns:
                type: array
                items:
                  type: object
                  properties:
                    statement_date:
                      type: string
                    reporting_interval:
                      type: string
                    scenario_type:
                      type: string
                    preparation_type:
                      type: string
                    prepared_by:
                      type: string
                      default: ''
                  required:
                  - statement_date
                  - reporting_interval
                  - scenario_type
                  - preparation_type
              rows:
                type: array
                items:
                  type: object
                  properties:
                    label:
                      type: string
                    values:
                      type: array
                      items:
                        type: object
                    spreading_template_line_item_id:
                      type:
                      - integer
                      - 'null'
                    spreading_template_line_item_ref:
                      type:
                      - string
                      - 'null'
                  required:
                  - label
                  - values
            required:
            - statement_type
            - columns
            - rows
      required:
      - statements
  securitySchemes:
    API_Key:
      type: http
      scheme: bearer
      bearerFormat: JWT
x-tagGroups:
- name: Tenant
  tags:
  - Api-Key
  - TenantSettings
- name: Templates
  tags:
  - SpreadingTemplate
  - DscrTemplate
  - GlobalCashflowTemplate
- name: Borrower
  tags:
  - Borrowers
  - Files
  - Loans
  - Requirements
  - Portfolios
- name: Normalized Data
  tags:
  - DataViews
  - Templates
- name: Analysis
  tags:
  - DscrAnalysis
  - GlobalCashflowAnalysis
- name: Events
  tags:
  - Webhooks
- name: Embedded UI
  tags:
  - EmbeddedDocument
  - EmbeddedFinancials
  - EmbeddedDscrAnalysis
  - EmbeddedGlobalCashflowAnalysis
