openapi: 3.2.0
info:
  title: Automated Spreading and Analysis Embedded Dscr Analysis API
  version: 1.3.1
  description: This REST API allows you to interact with the Automated Spreading processing and insights engine.
  x-logo:
    url: https://manual-public-web-static-resources.s3.amazonaws.com/public-api/Moodys-icon.svg
  contact:
    name: Moody's Automated Spreading Customer Support
    email: MA_NMR_Support@moodys.com
security:
- API_Key: []
tags:
- name: EmbeddedDscrAnalysis
  description: Embedded DSCR Analysis allows an API user to authenticate and embedded previously created DSCR analysis into a 3rd party workflow.
paths:
  /v1/embedded-dscr-analysis/{uuid}:
    get:
      operationId: retrieveEmbeddedDscrAnalysis
      description: ''
      parameters:
      - name: uuid
        in: path
        required: true
        description: ''
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddedDscrAnalysisWorkflow'
          description: ''
      tags:
      - EmbeddedDscrAnalysis
      summary: Retrieve embedded dscr analysis
      x-summary-source: derived
  /v1/embedded-dscr-analysis:
    post:
      operationId: createEmbeddedDscrAnalysis
      description: Returns a URL to an HTML webapp to view and modify a particular dscr analysis
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbeddedDscrAnalysisWorkflow'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmbeddedDscrAnalysisWorkflow'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmbeddedDscrAnalysisWorkflow'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddedDscrAnalysisWorkflow'
          description: ''
      tags:
      - EmbeddedDscrAnalysis
      summary: Create embedded dscr analysis
      x-summary-source: derived
components:
  schemas:
    EmbeddedDscrAnalysisWorkflow:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        dscr_analysis_uuid:
          type: string
          format: uuid
          description: UUID of the Analysis for this view
        created_date:
          type: string
          format: date-time
          readOnly: true
        loaded:
          type: boolean
          readOnly: true
        load_workflow_url:
          type: string
          format: uri
          readOnly: true
          pattern: "^(?:[a-z0-9.+-]*)://(?:[^\\s:@/]+(?::[^\\s:@/]*)?@)?(?:(?:0|25[0-5]|2[0-4][0-9]|1[0-9]?[0-9]?|[1-9][0-9]?)(?:\\.(?:0|25[0-5]|2[0-4][0-9]|1[0-9]?[0-9]?|[1-9][0-9]?)){3}|\\[[0-9a-f:.]+\\]|([a-z¡-\uFFFF0-9](?:[a-z¡-\uFFFF0-9-]{0,61}[a-z¡-\uFFFF0-9])?(?:\\.(?!-)[a-z¡-\uFFFF0-9-]{1,63}(?<!-))*\\.(?!-)(?:[a-z¡-\uFFFF-]{2,63}|xn--[a-z0-9]{1,59})(?<!-)\\.?|localhost))(?::[0-9]{1,5})?(?:[/?#][^\\s]*)?\\z"
        external_user_id:
          type:
          - string
          - 'null'
          description: Id to identify the user performing the work (e.g. email or username)
          maxLength: 255
        external_user_label:
          type:
          - string
          - 'null'
          description: Human readable label to identify the user performing the work (e.g. name)
          maxLength: 255
      required:
      - dscr_analysis_uuid
  securitySchemes:
    API_Key:
      type: http
      scheme: bearer
      bearerFormat: JWT
x-tagGroups:
- name: Tenant
  tags:
  - Api-Key
  - TenantSettings
- name: Templates
  tags:
  - SpreadingTemplate
  - DscrTemplate
  - GlobalCashflowTemplate
- name: Borrower
  tags:
  - Borrowers
  - Files
  - Loans
  - Requirements
  - Portfolios
- name: Normalized Data
  tags:
  - DataViews
  - Templates
- name: Analysis
  tags:
  - DscrAnalysis
  - GlobalCashflowAnalysis
- name: Events
  tags:
  - Webhooks
- name: Embedded UI
  tags:
  - EmbeddedDocument
  - EmbeddedFinancials
  - EmbeddedDscrAnalysis
  - EmbeddedGlobalCashflowAnalysis
