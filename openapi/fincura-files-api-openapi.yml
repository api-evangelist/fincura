openapi: 3.2.0
info:
  title: Automated Spreading and Analysis Files API
  version: 1.3.1
  description: This REST API allows you to interact with the Automated Spreading processing and insights engine.
  x-logo:
    url: https://manual-public-web-static-resources.s3.amazonaws.com/public-api/Moodys-icon.svg
  contact:
    name: Moody's Automated Spreading Customer Support
    email: MA_NMR_Support@moodys.com
security:
- API_Key: []
tags:
- name: Files
  description: Files serve as the source input data for our insights engine. They are represented by a `DocumentFile` record.
paths:
  /v1/document-file:
    get:
      operationId: listDocumentFiles
      description: List files submitted to Fincura
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - name: borrower_uuid
        required: false
        in: query
        description: Borrower to filter results for
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - count
                - results
                properties:
                  count:
                    type: integer
                    example: 123
                  next:
                    type:
                    - string
                    - 'null'
                    format: uri
                    example: http://api.example.org/accounts/?offset=400&limit=100
                  previous:
                    type:
                    - string
                    - 'null'
                    format: uri
                    example: http://api.example.org/accounts/?offset=200&limit=100
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/DocumentFileRead'
          description: ''
      tags:
      - Files
      summary: List DocumentFile records
    post:
      operationId: createDocumentFile
      description: 'Add a new file to Fincura for processing.


        The minimal document creation request requires just a `borrower_uuid` and the `media_type` of the file to process.


        POST /v1/document-file HTTP/1.1

        Host: api.amer.spreading.moodysanalytics.com

        Accept: application/json

        Authorization: Bearer eyJ0e...nFTRKTbcg

        Content-Type: application/json


        {

        "borrower_uuid": "6e64724a-25fc-4e1a-8071-1ef29845ab1d",

        "media_type": "application/pdf"

        }


        The above request will create a new document record in Fincura and return a url to send the file to, as seen below.


        {

        "uuid": "f67a21dd-32a0-4664-9cd4-4181640be400",

        "upload_url": "https://upload.fincura.com/f67a21dd-32a0-4664-9cd4-4181640be400/document.pdf?signature=mWFg4xsgm4EtFEt"

        }


        In a subsequent request, the file can be sent to the `upload_url` via HTTP PUT. The `Content-Length` and `Content-Type` headers are required. The `Content-Type` should match the `media_type` from the previous request.


        PUT /f67a21dd-32a0-4664-9cd4-4181640be400/document.pdf?signature=mWFg4xsgm4EtFEt HTTP/1.1

        Host: upload.fincura.com

        Content-Length: 18828

        Content-Type: application/pdf


        {FILE DATA}


        Fincura will begin processing the file once it has been completely uploaded.


        Additional fields described below:'
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentFileCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DocumentFileCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DocumentFileCreate'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentFileCreate'
          description: ''
        429:
          content:
            application/json:
              schema:
                properties:
                  details:
                    type: string
                    example: Request was throttled. Expected available in 35 seconds.
          description: Rate Limit
      tags:
      - Files
      summary: Submit a new DocumentFile
  /v1/document-file/{uuid}:
    get:
      operationId: retrieveDocumentFile
      description: Retrieve a file submitted to Fincura
      parameters:
      - name: uuid
        in: path
        required: true
        description: ''
        schema:
          type: string
      - name: borrower_uuid
        required: false
        in: query
        description: Borrower to filter results for
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentFileRead'
          description: ''
      tags:
      - Files
      summary: Get a DocumentFile
    delete:
      operationId: destroyDocumentFile
      description: Delete a file from Fincura.
      parameters:
      - name: uuid
        in: path
        required: true
        description: ''
        schema:
          type: string
      - name: borrower_uuid
        required: false
        in: query
        description: Borrower to filter results for
        schema:
          type: string
      responses:
        '204':
          description: ''
      tags:
      - Files
      summary: Delete a DocumentFile
  /v1/bulk-file/{uuid}:
    get:
      operationId: retrieveBulkFile
      description: Retrieve a bulk file submitted to Fincura
      parameters:
      - name: uuid
        in: path
        required: true
        description: ''
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkFileRead'
          description: ''
      tags:
      - Files
      summary: Retrieve a BulkFile
  /v1/bulk-file:
    post:
      operationId: createBulkFile
      description: 'Add a new file to Fincura that maps to many borrowers. Requires use of a specific file processor per file format. Speak with you Fincura account manager about available options on your account.


        POST /v1/bulk-file HTTP/1.1

        Host: api.amer.spreading.moodysanalytics.com

        Accept: application/json

        Authorization: Bearer eyJ0e...nFTRKTbcg

        Content-Type: application/json


        {

        "processor_key": "6e64724a-25fc-4e1a-8071-1ef29845ab1d",

        "media_type": "application/pdf""

        }


        The above request will create a new document record in Fincura and return a url to send the file to, as seen below.


        {

        "uuid": "d789dfd5-42ee-46df-99f2-e6725bee9678",

        "upload_url": "https://upload.fincura.com/d789dfd5-42ee-46df-99f2-e6725bee9678/document.pdf?signature=mWFg4xsgm4EtFEt"

        }


        In a subsequent request, the file can be sent to the `upload_url` via HTTP PUT. The `Content-Length` and `Content-Type` headers are required. The `Content-Type` should match the `media_type` from the previous request.


        PUT /d789dfd5-42ee-46df-99f2-e6725bee9678/document.pdf?signature=mWFg4xsgm4EtFEt HTTP/1.1

        Host: upload.fincura.com

        Content-Length: 18828

        Content-Type: application/pdf


        {FILE DATA}


        Fincura will begin processing the file once it has been completely uploaded.'
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkFileCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BulkFileCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BulkFileCreate'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkFileCreate'
          description: ''
      tags:
      - Files
      summary: Submit a new BulkFile
components:
  schemas:
    DocumentFileCreate:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        status:
          type: string
          readOnly: true
        created_date:
          type: string
          format: date-time
          readOnly: true
        borrower_uuid:
          type: string
          format: uuid
          description: UUID of the borrower for this file. (see [Borrowers](#tag/Borrowers))
        media_type:
          enum:
          - application/pdf
          - application/x-pdf
          - application/vnd.ms-excel
          - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
          - application/vnd.ms-excel.sheet.macroEnabled.12
          - image/png
          - image/gif
          - image/jpeg
          - application/json
          type: string
          writeOnly: true
          description: '[MIME type](https://developer.mozilla.org/en-US/docs/Glossary/MIME_type) of the file'
        filename:
          type: string
          description: Used to reference the original filename. Defaults to `document.{MEDIA TYPE FILE EXTENSION}` e.g. fye_2026.pdf
          maxLength: 200
        statements:
          type: array
          items:
            type: object
            properties:
              form_type:
                enum:
                - INCOME_STATEMENT
                - BALANCE_SHEET
                - TAX_RETURN
                - '1065'
                - '1040'
                - '1120'
                - 1120S
                - Puerto Rico Corporate
                - Puerto Rico Individual
                - Puerto Rico Schedule M Individual
                - Puerto Rico Schedule CO Individual
                - Puerto Rico Schedule D Individual
                - Puerto Rico Schedule F Individual
                - Puerto Rico Schedule H Individual
                - Puerto Rico Schedule IE Individual
                - Puerto Rico Schedule J Individual
                - Puerto Rico Schedule K Individual
                - Puerto Rico Schedule L Individual
                - Puerto Rico Schedule N Individual
                - Puerto Rico Schedule R1 Individual
                type: string
              start_date:
                type: string
                format: date
              end_date:
                type: string
                format: date
              tax_year:
                type: integer
                maximum: 2026
                minimum: 1901
          writeOnly: true
          description: "\nBy default, any document submitted to Fincura will be scanned for Income Statement and Balance Sheet information.\n\nThe engine can also be pointed at Tax Returns by setting a statement object with a `form_type` and `tax_year`. Supported tax form types: \n\n```\n{\n    \"borrower_uuid\": \"6e...845ab1d\",\n    \"media_type\": \"application/pdf\",\n    \"statements\": [\n        {\n          \"form_type\": \"1065\"\n          \"tax_year\": 2019\n        }\n      ]\n}\n```\n    \n\n"
        upload_url:
          type: string
          format: uri
          readOnly: true
          maxLength: 2500
          pattern: "^(?:[a-z0-9.+-]*)://(?:[^\\s:@/]+(?::[^\\s:@/]*)?@)?(?:(?:0|25[0-5]|2[0-4][0-9]|1[0-9]?[0-9]?|[1-9][0-9]?)(?:\\.(?:0|25[0-5]|2[0-4][0-9]|1[0-9]?[0-9]?|[1-9][0-9]?)){3}|\\[[0-9a-f:.]+\\]|([a-z¡-\uFFFF0-9](?:[a-z¡-\uFFFF0-9-]{0,61}[a-z¡-\uFFFF0-9])?(?:\\.(?!-)[a-z¡-\uFFFF0-9-]{1,63}(?<!-))*\\.(?!-)(?:[a-z¡-\uFFFF-]{2,63}|xn--[a-z0-9]{1,59})(?<!-)\\.?|localhost))(?::[0-9]{1,5})?(?:[/?#][^\\s]*)?\\z"
        external_id:
          type: string
          description: External ID is used to uniquely identify a record from your system in our system. Must be unique across records.
          maxLength: 255
        custom_attributes:
          type: object
        document_type:
          enum:
          - INCOME_STATEMENT
          - BALANCE_SHEET
          - TAX_RETURN
          type: string
          default: TAX_RETURN
      required:
      - borrower_uuid
      - media_type
    BulkFileCreate:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        status:
          type: string
          readOnly: true
        created_date:
          type: string
          format: date-time
          readOnly: true
        media_type:
          enum:
          - application/pdf
          - application/x-pdf
          - application/vnd.ms-excel
          - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
          - application/vnd.ms-excel.sheet.macroEnabled.12
          - image/png
          - image/gif
          - image/jpeg
          - application/json
          type: string
          writeOnly: true
          description: '[MIME type](https://developer.mozilla.org/en-US/docs/Glossary/MIME_type) of the file'
        filename:
          type: string
          description: Used to reference the original filename. Defaults to `document.{MEDIA TYPE FILE EXTENSION}` e.g. fye_2026.pdf
          maxLength: 200
        processor_key:
          type: string
          description: Key of custom processor
        upload_url:
          type: string
          format: uri
          readOnly: true
          maxLength: 2500
          pattern: "^(?:[a-z0-9.+-]*)://(?:[^\\s:@/]+(?::[^\\s:@/]*)?@)?(?:(?:0|25[0-5]|2[0-4][0-9]|1[0-9]?[0-9]?|[1-9][0-9]?)(?:\\.(?:0|25[0-5]|2[0-4][0-9]|1[0-9]?[0-9]?|[1-9][0-9]?)){3}|\\[[0-9a-f:.]+\\]|([a-z¡-\uFFFF0-9](?:[a-z¡-\uFFFF0-9-]{0,61}[a-z¡-\uFFFF0-9])?(?:\\.(?!-)[a-z¡-\uFFFF0-9-]{1,63}(?<!-))*\\.(?!-)(?:[a-z¡-\uFFFF-]{2,63}|xn--[a-z0-9]{1,59})(?<!-)\\.?|localhost))(?::[0-9]{1,5})?(?:[/?#][^\\s]*)?\\z"
        external_id:
          type: string
          description: External ID is used to uniquely identify a record from your system in our system. Must be unique across records.
          maxLength: 255
        custom_attributes:
          type: object
      required:
      - media_type
    DocumentFileRead:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        status:
          type: string
          readOnly: true
        pipeline_step:
          type: string
          readOnly: true
        created_date:
          type: string
          format: date-time
          readOnly: true
        borrower_uuid:
          type: string
          format: uuid
          description: UUID of the borrower for this file.
        borrower_name:
          type: string
          readOnly: true
        filename:
          type: string
          description: Used to reference the original filename. Defaults to `document.{MEDIA TYPE FILE EXTENSION}` e.g. fye_2026.pdf
          maxLength: 200
        statement_types:
          type: array
          items: {}
          readOnly: true
          default:
          - OTHER
        custom_attributes:
          type: object
        document_type:
          enum:
          - INCOME_STATEMENT
          - BALANCE_SHEET
          - TAX_RETURN
          type: string
          default: TAX_RETURN
        review_queue_item_status:
          type: string
          readOnly: true
        review_queue_item_status_code:
          type: string
          readOnly: true
        review_queue_item_exception_message:
          type: string
          readOnly: true
        review_queue_item_exception_class:
          type: string
          readOnly: true
        tax_form_type:
          type:
          - string
          - 'null'
          maxLength: 50
      required:
      - borrower_uuid
    BulkFileRead:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        status:
          type: string
          readOnly: true
        created_date:
          type: string
          format: date-time
          readOnly: true
        media_type:
          enum:
          - application/pdf
          - application/x-pdf
          - application/vnd.ms-excel
          - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
          - application/vnd.ms-excel.sheet.macroEnabled.12
          - image/png
          - image/gif
          - image/jpeg
          - application/json
          type: string
          writeOnly: true
          description: '[MIME type](https://developer.mozilla.org/en-US/docs/Glossary/MIME_type) of the file'
        filename:
          type: string
          description: Used to reference the original filename. Defaults to `document.{MEDIA TYPE FILE EXTENSION}` e.g. fye_2026.pdf
          maxLength: 200
        document_files:
          type: array
          items:
            type: string
          readOnly: true
        processor_key:
          type: string
          description: Key of custom processor
        external_id:
          type: string
          description: External ID is used to uniquely identify a record from your system in our system. Must be unique across records.
          maxLength: 255
        custom_attributes:
          type: object
      required:
      - media_type
  securitySchemes:
    API_Key:
      type: http
      scheme: bearer
      bearerFormat: JWT
x-tagGroups:
- name: Tenant
  tags:
  - Api-Key
  - TenantSettings
- name: Templates
  tags:
  - SpreadingTemplate
  - DscrTemplate
  - GlobalCashflowTemplate
- name: Borrower
  tags:
  - Borrowers
  - Files
  - Loans
  - Requirements
  - Portfolios
- name: Normalized Data
  tags:
  - DataViews
  - Templates
- name: Analysis
  tags:
  - DscrAnalysis
  - GlobalCashflowAnalysis
- name: Events
  tags:
  - Webhooks
- name: Embedded UI
  tags:
  - EmbeddedDocument
  - EmbeddedFinancials
  - EmbeddedDscrAnalysis
  - EmbeddedGlobalCashflowAnalysis
