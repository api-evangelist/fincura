openapi: 3.0.2
info:
  title: Automated Spreading and Analysis Api-Key EmbeddedFinancials API
  version: 1.3.1
  description: "This [REST API](https://en.wikipedia.org/wiki/Representational_state_transfer) allows you to interact with the Automated Spreading processing and insights engine. \n\n# Authentication\n\nThis API uses API keys generated from a Automated Spreading User account. To get access to your User account, speak with your Automated Spreading account manager.\n\n# Accepted Media Types\n\n| File&nbsp;Type&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; | Extension(s)     | Content-Type(s) |\n| -------------------------------- |-------------- | ------------ |\n| PDF File | .pdf | `application/pdf` , `application/x-pdf` |\n| Excel File | .xls | `application/vnd.ms-excel`  |\n| Excel File | .xlsx | `application/vnd.openxmlformats-officedocument.spreadsheetml.sheet`  |\n| Excel File | .xlsm | `application/vnd.ms-excel.sheet.macroEnabled.12`  |\n| PNG Image | .png | `image/png`  |\n| GIF Image | .gif | `image/gif`  |\n| JPG Image | .jpg, .jpeg | `image/jpeg`  |\n| GIF Image | .gif | `image/gif`  |\n| JSON File | .json | `application/json`  |\n\n\n# Getting Started\n\n1. [Create a Borrower](#operation/createBorrower) \n2. [Add a file](#operation/createDocumentFile) for that Borrower.\n3. Analyze in the Automated Spreading App\n\n****"
  x-logo:
    url: https://manual-public-web-static-resources.s3.amazonaws.com/public-api/Moodys-icon.svg
  contact:
    name: Moody's Automated Spreading Customer Support
    email: MA_NMR_Support@moodys.com
security:
- API_Key: []
tags:
- name: EmbeddedFinancials
  description: Embedded Financials allows an API user to authenticate and embedded borrower financials into a 3rd party workflow.
paths:
  /v1/embedded-financials/{uuid}:
    get:
      operationId: retrieveEmbeddedFinancials
      description: ''
      parameters:
      - name: uuid
        in: path
        required: true
        description: ''
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddedFinancialsWorkflow'
          description: ''
      tags:
      - EmbeddedFinancials
  /v1/embedded-financials:
    post:
      operationId: createEmbeddedFinancials
      description: Returns a URL to an HTML webapp to view the financials of a borrower
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbeddedFinancialsWorkflow'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmbeddedFinancialsWorkflow'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmbeddedFinancialsWorkflow'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddedFinancialsWorkflow'
          description: ''
      tags:
      - EmbeddedFinancials
components:
  schemas:
    EmbeddedFinancialsWorkflow:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        borrower_uuid:
          type: string
          format: uuid
          description: UUID of the Borrower for this view
        created_date:
          type: string
          format: date-time
          readOnly: true
        loaded:
          type: boolean
          readOnly: true
        load_workflow_url:
          type: string
          format: uri
          readOnly: true
          pattern: "^(?:[a-z0-9.+-]*)://(?:[^\\s:@/]+(?::[^\\s:@/]*)?@)?(?:(?:0|25[0-5]|2[0-4][0-9]|1[0-9]?[0-9]?|[1-9][0-9]?)(?:\\.(?:0|25[0-5]|2[0-4][0-9]|1[0-9]?[0-9]?|[1-9][0-9]?)){3}|\\[[0-9a-f:.]+\\]|([a-z¡-\uFFFF0-9](?:[a-z¡-\uFFFF0-9-]{0,61}[a-z¡-\uFFFF0-9])?(?:\\.(?!-)[a-z¡-\uFFFF0-9-]{1,63}(?<!-))*\\.(?!-)(?:[a-z¡-\uFFFF-]{2,63}|xn--[a-z0-9]{1,59})(?<!-)\\.?|localhost))(?::[0-9]{1,5})?(?:[/?#][^\\s]*)?\\z"
        external_user_id:
          type: string
          nullable: true
          description: Id to identify the user performing the work (e.g. email or username)
          maxLength: 255
        external_user_label:
          type: string
          nullable: true
          description: Human readable label to identify the user performing the work (e.g. name)
          maxLength: 255
      required:
      - borrower_uuid
  securitySchemes:
    API_Key:
      type: http
      scheme: bearer
      bearerFormat: JWT
x-tagGroups:
- name: Tenant
  tags:
  - Api-Key
  - TenantSettings
- name: Templates
  tags:
  - SpreadingTemplate
  - DscrTemplate
  - GlobalCashflowTemplate
- name: Borrower
  tags:
  - Borrowers
  - Files
  - Loans
  - Requirements
  - Portfolios
- name: Normalized Data
  tags:
  - DataViews
  - Templates
- name: Analysis
  tags:
  - DscrAnalysis
  - GlobalCashflowAnalysis
- name: Events
  tags:
  - Webhooks
- name: Embedded UI
  tags:
  - EmbeddedDocument
  - EmbeddedFinancials
  - EmbeddedDscrAnalysis
  - EmbeddedGlobalCashflowAnalysis
