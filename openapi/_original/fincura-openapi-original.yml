                  payment_day:
                    type: integer
                    description: Used to determine what day of the month payments
                      are made on for amortization
                  last_day_for_next_payment:
                    type: integer
                    description: Last day in the month that the next month's payment
                      can be made
                required:
                - monthly_payment
