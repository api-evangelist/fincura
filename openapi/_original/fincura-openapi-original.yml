      summary: Get the most recent period of data for a Borrower
  /v1/data-view/all/{uuid_or_labeled_key}:
    get:
      operationId: retrieveAllDataViews
      description: 'Retrieve DataViews for all standardized data for a borrower, by
        primary or secondary key


        The path variable `uuid_or_labeled_key`, can either be a uuid or a label:key
        (label=key is also accepted).

        The labels `borrower_uuid` and `external_id` are supported.


        examples of path variables:

        1. 2dfefa9c-c91e-4cc1-b783-363659e596f5

        2. borrower_uuid:2dfefa9c-c91e-4cc1-b783-363659e596f5

        3. borrower_uuid=2dfefa9c-c91e-4cc1-b783-363659e596f5

        4. external_id=1000882211


        values 1..3 are equivalent, and if the DataView has that external_id, so is
        4.'
      parameters:
      - name: uuid_or_labeled_key
        in: path
        required: true
        description: ''
        schema:
          type: string
      - name: reporting_interval
        required: false
        in: query
        description: Reporting Interval of the financial data
        schema:
          type: string
          enum:
          - MONTHLY
          - QUARTERLY
          - SEMI_ANNUALLY
          - ANNUALLY
          - FISCAL_YTD
          - TTM
      - name: preparation_type
        required: false
        in: query
        description: Preparation Type of the finanical data
        schema:
          type: string
          enum:
          - UNQUALIFIED
          - QUALIFIED
          - TAX_RETURN
          - REVIEWED
          - CPA_PREP
          - NTR
          - MANAGEMENT
          - COMBINED
          - UNKNOWN
          - CALCULATED
          - ANALYST
          - UNQUALIFIED_IMPORT
          - QUALIFIED_IMPORT
          - TAX_RETURN_IMPORT
          - REVIEWED_IMPORT
          - CPA_PREP_IMPORT
          - NTR_IMPORT
          - MANAGEMENT_IMPORT
          - ANALYST_IMPORT
          - IMPORTED
          - FORECASTED
          - ANNUALIZED
      - name: period_key_uuid
        required: false
        in: query
        description: Period in a dataview to return.
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataView'
          description: ''
      tags:
      - DataViews
      summary: Get all dataviews for a specific borrower, using a primary or secondary
        key
