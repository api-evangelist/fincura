  /v1/data-view/create-dataview-from-orbis:
    post:
      operationId: createDataViewFromOrbis
      description: "Create a DataView by fetching financial data from Orbis API.\n\
        \nAccepts an Orbis company ID and returns annual financial statements \nin\
        \ standardized DataView format.\n\n**Request Parameters:**\n\n- **orbis_id**\
        \ (required): The Orbis company identifier to fetch financial data for.\n\n\
        - **spreading_template_uuid** (optional): UUID of the spreading template to\
        \ use for calculations.\n  If not provided, the borrower's default template\
        \ is used.\n\n- **num_periods** (optional, default=1): Number of annual periods\
        \ to return (1-100). \n  Each period becomes a column in the DataView. Orbis\
        \ returns all available periods \n  up to this number.\n\n- **lookback_window**\
        \ (optional, default=12): Data freshness check in months (1-120). \n  If the\
        \ most recent Orbis financial data is older than this window, an error is\
        \ \n  returned. For example, with a 12-month lookback, data dated before 12\
        \ months ago \n  will be rejected.\n\n- **refs_to_exclude** (optional): List\
        \ of REF names to exclude from calculations.\n\n**Response:**\n\n- **dataview**:\
        \ Full DataView structure with calculated values and multiple columns \n \
        \ (one per period requested)\n- **metadata**: Orbis company information, fiscal\
        \ period details, currency, etc.\n- **statistics**: Completeness metrics showing\
        \ data coverage\n- **warnings**: Any validation warnings (optional)\n\n**Error\
        \ Responses:**\n\n- **OrbisCompanyNotFoundError**: The Orbis ID does not exist\
        \ or has no data\n- **OrbisDataTooStaleError**: Most recent data is older\
        \ than the lookback window\n- **OrbisAPIKeyError**: API key is missing or\
        \ invalid\n- **OrbisAPIConnectionError**: Unable to connect to Orbis API\n\
        \nThis is an ephemeral operation - no data is persisted to the database.\n\
        The spreading calculations are performed in real-time using the Orbis data."
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrbisDataViewRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OrbisDataViewRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OrbisDataViewRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrbisDataViewRequest'
          description: ''
      tags:
      - DataViews
      summary: Create DataView from Orbis company data
  /v1/financial-statement-submission:
    post:
      operationId: createFinancialStatementSubmission
      description: Submit structured financial statement data (JSON body); file is
        stored in S3 and processing is queued.
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinancialStatementSubmission'
          application/x-www-form-urlencoded:
            schema:
