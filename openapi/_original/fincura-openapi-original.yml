openapi: 3.0.2
info:
  title: Automated Spreading and Analysis API
  version: 1.3.1
  description: "This [REST API](https://en.wikipedia.org/wiki/Representational_state_transfer)\
    \ allows you to interact with the Automated Spreading processing and insights\
    \ engine. \n\n# Authentication\n\nThis API uses API keys generated from a Automated\
    \ Spreading User account. To get access to your User account, speak with your\
    \ Automated Spreading account manager.\n\n# Accepted Media Types\n\n| File&nbsp;Type&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;\
    \ | Extension(s)     | Content-Type(s) |\n| -------------------------------- |--------------\
    \ | ------------ |\n| PDF File | .pdf | `application/pdf` , `application/x-pdf`\
    \ |\n| Excel File | .xls | `application/vnd.ms-excel`  |\n| Excel File | .xlsx\
    \ | `application/vnd.openxmlformats-officedocument.spreadsheetml.sheet`  |\n|\
    \ Excel File | .xlsm | `application/vnd.ms-excel.sheet.macroEnabled.12`  |\n|\
    \ PNG Image | .png | `image/png`  |\n| GIF Image | .gif | `image/gif`  |\n| JPG\
    \ Image | .jpg, .jpeg | `image/jpeg`  |\n| GIF Image | .gif | `image/gif`  |\n\
    | JSON File | .json | `application/json`  |\n\n\n# Getting Started\n\n1. [Create\
    \ a Borrower](#operation/createBorrower) \n2. [Add a file](#operation/createDocumentFile)\
    \ for that Borrower.\n3. Analyze in the Automated Spreading App\n\n****"
  x-logo:
    url: https://manual-public-web-static-resources.s3.amazonaws.com/public-api/Moodys-icon.svg
  contact:
    name: Moody's Automated Spreading Customer Support
    email: MA_NMR_Support@moodys.com
