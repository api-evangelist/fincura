  /v1/bulk-file:
    post:
      operationId: createBulkFile
      description: "Add a new file to Fincura that maps to many borrowers. Requires\
        \ use of a specific file processor per file format. Speak with you Fincura\
        \ account manager about available options on your account.\n\n\n    POST /v1/bulk-file\
        \ HTTP/1.1\n    Host: api.amer.spreading.moodysanalytics.com\n    Accept:\
        \ application/json\n    Authorization: Bearer eyJ0e...nFTRKTbcg\n    Content-Type:\
        \ application/json\n\n    {\n        \"processor_key\": \"6e64724a-25fc-4e1a-8071-1ef29845ab1d\"\
        ,\n        \"media_type\": \"application/pdf\"\"\n    }\n    \n\nThe above\
        \ request will create a new document record in Fincura and return a url to\
        \ send the file to, as seen below.\n\n    {\n        \"uuid\": \"d789dfd5-42ee-46df-99f2-e6725bee9678\"\
        ,\n        \"upload_url\": \"https://upload.fincura.com/d789dfd5-42ee-46df-99f2-e6725bee9678/document.pdf?signature=mWFg4xsgm4EtFEt\"\
        \n    }\n\nIn a subsequent request, the file can be sent to the `upload_url`\
        \ via [HTTP PUT](https://developer.mozilla.org/en-US/docs/Web/HTTP/Methods/PUT).\
        \ The `Content-Length` and `Content-Type` headers are required. The `Content-Type`\
        \ should match the `media_type` from the previous request.\n\n    PUT /d789dfd5-42ee-46df-99f2-e6725bee9678/document.pdf?signature=mWFg4xsgm4EtFEt\
        \ HTTP/1.1\n    Host: upload.fincura.com\n    Content-Length: 18828\n    Content-Type:\
        \ application/pdf\n    \n    {FILE  DATA}\n\nFincura will begin processing\
        \ the file once it has been completely uploaded."
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkFileCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BulkFileCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BulkFileCreate'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkFileCreate'
          description: ''
      tags:
      - Files
      summary: Submit a new BulkFile
