                                type: number
                                multipleOf: 0.01
                              error:
                                type: string
                              error_message:
                                type: string
                              line_item:
                                type: object
                                properties:
                                  id:
                                    type: integer
                                  label:
                                    type: string
                                  ref:
                                    type: string
                                required:
                                - id
                                - label
                                - ref
                            required:
                            - value
                            - error
                            - error_message
                            - line_item
                        required:
                        - calculated_value
                    source_comments:
                      type: array
                      items:
                        type: object
                        properties:
