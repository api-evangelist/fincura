          - SEMI_ANNUALLY
          - ANNUALLY
          - FISCAL_YTD
          - TTM
      - name: preparation_type
        required: false
        in: query
        description: Preparation Type of the finanical data
        schema:
          type: string
          enum:
          - UNQUALIFIED
          - QUALIFIED
          - TAX_RETURN
          - REVIEWED
          - CPA_PREP
          - NTR
          - MANAGEMENT
          - COMBINED
          - UNKNOWN
          - CALCULATED
          - ANALYST
          - UNQUALIFIED_IMPORT
          - QUALIFIED_IMPORT
          - TAX_RETURN_IMPORT
          - REVIEWED_IMPORT
          - CPA_PREP_IMPORT
          - NTR_IMPORT
          - MANAGEMENT_IMPORT
          - ANALYST_IMPORT
          - IMPORTED
          - FORECASTED
          - ANNUALIZED
      - name: column_limit
        required: false
        in: query
