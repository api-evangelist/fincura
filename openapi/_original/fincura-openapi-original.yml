components:
  schemas:
    DataView:
      type: object
      properties:
        title:
          type: string
        borrower_uuid:
          type: string
          format: uuid
          description: UUID of the borrower for this DataView. (see [Borrowers](#tag/Borrowers))
        template_uuid:
          type: string
          format: uuid
          description: UUID of the template used for spreading for the given company.
        columns:
          type: array
          items:
            type: object
            properties:
              label:
                type: string
              statement_date:
                type: string
                format: date-time
              reporting_interval:
                type: string
              preparation_type:
                type: string
              prepared_by:
                type: string
              months_in_interval:
                type: integer
              scenario:
                type: string
              scenario_label:
                type: string
              fiscal_year_end:
                type: string
              currency_format:
                type: string
              modified_date:
                type: string
                format: date
              modified_by:
                type: string
              cells:
                type: array
                items:
                  type: object
                  properties:
                    calculated_value:
                      type: object
                      properties:
                        value:
                          type: number
                          multipleOf: 0.01
                        error:
                          type: string
                        error_message:
                          type: string
                        line_item:
                          type: object
                          properties:
                            id:
                              type: integer
                            label:
                              type: string
                            ref:
                              type: string
                            standardized_name:
                              type: string
                          required:
                          - id
                          - label
                          - ref
                          - standardized_name
                        source_items:
                          type: array
                          items:
                            type: object
                            properties:
                              label:
                                type: string
                              value:
                                type: integer
                            required:
                            - label
                            - value
                        source_comments:
                          type: array
                          items:
                            type: object
                            properties:
                              comment:
                                type: string
                              created_by:
                                type: string
                                nullable: true
                              created_date:
                                type: string
                                format: date-time
                                nullable: true
                              changed_by:
                                type: string
                                nullable: true
                              changed_date:
                                type: string
                                format: date-time
                                nullable: true
                              stmt_name:
                                type: string
                                nullable: true
                              line_item_label:
                                type: string
                                nullable: true
                            required:
                            - comment
                      required:
                      - value
                      - error
                      - error_message
                      - line_item
                      - source_items
                  required:
                  - calculated_value
              source_comments:
                type: array
                items:
                  type: object
                  properties:
                    comment:
                      type: string
                    created_by:
                      type: string
                      nullable: true
                    created_date:
                      type: string
                      format: date-time
                      nullable: true
                    changed_by:
                      type: string
                      nullable: true
                    changed_date:
                      type: string
                      format: date-time
                      nullable: true
                    stmt_name:
                      type: string
                      nullable: true
                    line_item_label:
                      type: string
                      nullable: true
                  required:
                  - comment
            required:
            - label
            - statement_date
            - reporting_interval
            - preparation_type
            - prepared_by
            - months_in_interval
            - scenario
            - scenario_label
            - fiscal_year_end
            - currency_format
            - cells
        rows:
          type: array
          items:
            type: object
            properties:
              label:
                type: string
              line_item:
                type: object
                properties:
                  id:
                    type: integer
                  label:
                    type: string
                  ref:
                    type: string
                required:
                - id
                - label
                - ref
              indentation:
                type: integer
              row_format:
                type: object
                properties:
                  header:
                    type: boolean
                  bold:
                    type: boolean
                  is_parent:
                    type: boolean
                required:
                - header
                - bold
                - is_parent
              cell_format:
                type: object
                properties:
                  text_format:
                    enum:
                    - PERCENT
                    - CURRENCY
                    - RATIO
                    - DAYS
                    type: string
                required:
                - text_format
              excludeFromRoundingAndMultiplication:
                type: boolean
                default: false
            required:
            - label
            - line_item
            - indentation
            - row_format
            - cell_format
      required:
      - title
      - borrower_uuid
      - columns
      - rows
    AllPeriodsList:
      type: object
      properties:
        borrower_uuid:
          type: string
          format: uuid
        periods:
          type: array
          items:
            type: object
            properties:
              value:
                type: string
              label:
                type: string
              interval:
                type: string
              year:
                type: integer
              interval_index:
                type: integer
              preparation_type:
                type: string
              fiscal_year_end:
                type: string
              scenario:
                type: string
              projection_name:
                type: string
              period_key_uuid:
                type: string
              currency_format:
                type: string
            required:
            - value
            - label
            - interval
            - year
            - interval_index
            - preparation_type
            - fiscal_year_end
            - scenario
      required:
      - borrower_uuid
      - periods
    DocumentFileRead:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        status:
          type: string
          readOnly: true
        pipeline_step:
          type: string
          readOnly: true
        created_date:
          type: string
          format: date-time
          readOnly: true
        borrower_uuid:
          type: string
          format: uuid
          description: UUID of the borrower for this file.
        borrower_name:
          type: string
          readOnly: true
        filename:
          type: string
          description: Used to reference the original filename. Defaults to `document.{MEDIA
            TYPE FILE EXTENSION}` e.g. fye_2026.pdf
          maxLength: 200
        statement_types:
          type: array
          items: {}
          readOnly: true
          default:
          - OTHER
        custom_attributes:
          type: object
        document_type:
          enum:
          - INCOME_STATEMENT
          - BALANCE_SHEET
          - TAX_RETURN
          type: string
          default: TAX_RETURN
        review_queue_item_status:
          type: string
          readOnly: true
        review_queue_item_status_code:
          type: string
          readOnly: true
        review_queue_item_exception_message:
          type: string
          readOnly: true
        review_queue_item_exception_class:
          type: string
          readOnly: true
        tax_form_type:
          type: string
          nullable: true
          maxLength: 50
      required:
      - borrower_uuid
    BulkFileRead:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        status:
          type: string
          readOnly: true
        created_date:
          type: string
          format: date-time
          readOnly: true
        media_type:
          enum:
          - application/pdf
          - application/x-pdf
          - application/vnd.ms-excel
          - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
          - application/vnd.ms-excel.sheet.macroEnabled.12
          - image/png
          - image/gif
          - image/jpeg
          - application/json
          type: string
          writeOnly: true
          description: '[MIME type](https://developer.mozilla.org/en-US/docs/Glossary/MIME_type)
            of the file'
        filename:
          type: string
          description: Used to reference the original filename. Defaults to `document.{MEDIA
            TYPE FILE EXTENSION}` e.g. fye_2026.pdf
          maxLength: 200
        document_files:
          type: array
          items:
            type: string
          readOnly: true
        processor_key:
          type: string
          description: Key of custom processor
        external_id:
          type: string
          description: External ID is used to uniquely identify a record from your
            system in our system. Must be unique across records.
          maxLength: 255
        custom_attributes:
          type: object
      required:
      - media_type
    Borrower:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          description: Name of the Borrower. Must be unique across Borrower records
          maxLength: 500
        created_date:
          type: string
          format: date-time
          readOnly: true
        portfolio_uuid:
          type: string
          format: uuid
          description: UUID of the Portfolio for this Borrower. (see [Portfolios](#tag/Portfolios))
        spreading_template_uuid:
          type: string
          format: uuid
          description: UUID of the SpreadingTemplate for this Borrower
        external_id:
          type: string
          nullable: true
          description: External ID is used to uniquely identify a record from your
            system in our system. Must be unique across records.
          maxLength: 250
        contact_email:
          type: string
          format: email
          description: Borrower contact email
        contact_person:
          type: string
          nullable: true
          description: Borrower contact Full Name
          maxLength: 100
        contact_phone:
          type: string
          nullable: true
          description: Borrower contact Phone Number
          maxLength: 100
        sic_code:
          type: string
          nullable: true
          maxLength: 4
        naics_code:
          type: string
          nullable: true
          maxLength: 6
        sic_industry:
          enum:
          - UNKNOWN
          - AGRICULTURE_FORESTRY_FISHING
          - CONSTRUCTION
          - MINING
          - TRANSPORTATION_AND_PUBLIC_UTILITIES
          - WHOLESALE_TRADE
          - RETAIL_TRADE
          - MANUFACTURING
          - FINANCE_INSURANCE_REAL_ESTATE
          - SERVICES
          - PUBLIC_ADMINISTRATION
          type: string
        custom_attributes:
          type: object
        is_individual:
          type: boolean
          default: false
          description: If borrower is a person or individual, pass 'True'
        region:
          type: string
          nullable: true
          description: Region of this Borrower
          maxLength: 75
        country:
          type: string
          nullable: true
          description: Country of this Borrower
          maxLength: 75
        default_spreading_template_subtype:
          type: string
          nullable: true
          maxLength: 50
      required:
      - name
    Portfolio:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          description: Name of the Portfolio. Must be unique across Portfolio records
          maxLength: 200
        created_date:
          type: string
          format: date-time
          readOnly: true
        external_id:
          type: string
          description: External ID is used to uniquely identify a record from your
            system in our system. Must be unique across records.
          maxLength: 255
      required:
      - name
    Loan:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          description: Title of the Loan. Must be unique for the Borrower
          maxLength: 200
        description:
          type: string
          nullable: true
        created_date:
          type: string
          format: date-time
          readOnly: true
        external_id:
          type: string
          nullable: true
          description: External ID is used to uniquely identify a record from your
            system in our system. Must be unique across records.
          maxLength: 250
        loan_id:
          type: string
          nullable: true
          maxLength: 250
        contract_type:
          enum:
          - LEASE
          - LOAN
          - NOT_APPLICABLE
          type: string
        borrower_uuid:
          type: string
          format: uuid
          description: UUID of the borrower for this loan. (see [Borrowers](#tag/Borrowers))
        borrower_info:
          type: object
          properties:
            name:
              type: string
              maxLength: 500
            industry:
              enum:
              - UNKNOWN
              - AGRICULTURE_FORESTRY_FISHING
              - CONSTRUCTION
              - MINING
              - TRANSPORTATION_AND_PUBLIC_UTILITIES
              - WHOLESALE_TRADE
              - RETAIL_TRADE
              - MANUFACTURING
              - FINANCE_INSURANCE_REAL_ESTATE
              - SERVICES
              - PUBLIC_ADMINISTRATION
              type: string
            naics_code:
              type: integer
              maximum: 999999
              nullable: true
              minimum: 0
            address:
              type: string
              nullable: true
            city:
              type: string
              nullable: true
              maxLength: 255
            state:
              type: string
              nullable: true
              maxLength: 50
            zipcode:
              type: string
              nullable: true
              maxLength: 20
            country:
              type: string
              nullable: true
              maxLength: 255
            email:
              type: string
              format: email
              nullable: true
              maxLength: 254
            company_notes:
              type: string
              nullable: true
            dun_bradstreet_score:
              type: integer
              maximum: 100
              nullable: true
              minimum: 0
            paynet_score:
              type: string
              nullable: true
              maxLength: 50
          required:
          - name
          description: Borrower information specific to this loan (does not update
            the underlying Borrower)
        principal:
          type: number
          multipleOf: 0.01
          maximum: 1000000000000000000
          minimum: 0
          description: Original principal value
        interest_rate:
          type: number
          multipleOf: 0.0001
          maximum: 100
          minimum: 0
        interest_type:
          enum:
          - FIXED
          - ADJUSTABLE
          type: string
        term_months:
          type: integer
        payment_type:
          enum:
          - PRINCIPAL_AND_INTEREST
          - PRINCIPAL_PLUS_INTEREST
          - IO_PERIOD
          type: string
        state:
          enum:
          - PROPOSED
          - APPROVED
          - DECLINED
          - ACTIVE
          - PAID_OFF
          - DESISTED
          type: string
        payment_status:
          enum:
          - CURRENT
          - GRACE_PERIOD
          - DELINQUENT
          type: string
        start_date:
          type: string
          format: date
          nullable: true
        end_date:
          type: string
          format: date
          readOnly: true
          description: Loan end date. Calculated field
        monthly_payment:
          type: number
          multipleOf: 0.01
          maximum: 1000000000000000000
          minimum: -1000000000000000000
          readOnly: true
          description: calculated field
        payments_remaining:
          type: integer
          readOnly: true
          description: Calculated field
        outstanding_principal:
          type: number
          multipleOf: 0.01
          maximum: 1000000000000000000
          minimum: -1000000000000000000
          readOnly: true
          description: calculated field
        interest_accrued:
          type: number
          multipleOf: 0.01
          maximum: 1000000000000000000
          minimum: -1000000000000000000
          readOnly: true
          description: calculated field
        loan_to_value:
          type: number
          multipleOf: 0.01
          maximum: 10000
          minimum: -10000
          readOnly: true
          description: calculated field
        scorecard:
          enum:
          - PASSED
          - FAILED
          - NOT_APPLICABLE
          type: string
          nullable: true
        collateral_type:
          enum:
          - NONE
          - CASH
          - AR
          - IP
          - REAL_ESTATE
          - EQUIPMENT
          type: string
        collateral_value:
          type: number
          multipleOf: 0.01
          maximum: 1000000000000000000
          minimum: 0
          nullable: true
        collateral_life_months:
          type: integer
          description: The life of the collateral in months
        residual_value:
          type: number
          multipleOf: 0.01
          maximum: 1000000000000000000
          minimum: 0
          nullable: true
        balloon_payment:
          type: number
          multipleOf: 0.01
          maximum: 1000000000000000000
          minimum: 0
          nullable: true
        last_payment_date:
          type: string
          format: date
          nullable: true
        compliance_info:
          type: object
          properties:
            ofac_sanctions:
              type: boolean
            pacer_bankruptcies:
              type: boolean
            state_court_claims:
              type: boolean
            divisions_of_corp_report:
              type: boolean
          description: Compliance information for this loan and borrower
        template_uuid:
          type: string
          format: uuid
          writeOnly: true
          description: DSRC template to use for finanical information
        periods:
          type: array
          items:
            type: object
            properties:
              reporting_period:
