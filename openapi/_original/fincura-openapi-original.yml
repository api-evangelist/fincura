    OrbisDataViewRequest:
      type: object
      properties:
        orbis_id:
          type: string
          description: Orbis company identifier
        spreading_template_uuid:
          type: string
          format: uuid
          nullable: true
          description: 'Optional: UUID of the spreading template to use. If not provided,
            uses the borrower''s default template.'
        num_periods:
          type: integer
          maximum: 100
          minimum: 1
          default: 1
          description: Number of annual periods to fetch (1-100). Defaults to 1. Orbis
            returns all available periods up to this number.
        lookback_window:
          type: integer
          maximum: 120
          minimum: 1
          default: 12
          description: Lookback window in months (1-120). Defaults to 12. If the most
            recent Orbis financial data is older than this window, an error is returned.
        refs_to_exclude:
          type: array
          items:
            type: string
          description: 'Optional: List of REF names to exclude from calculations'
        is_ephemeral:
          type: boolean
          default: true
          description: When true (default), returns an ephemeral DataView without
            persisting data. When false, translates Orbis data into a financial statement
            submission and pushes it through the spreading pipeline to completion.
            Requires external_company_id.
        external_company_id:
          type: string
          nullable: true
          description: Required when is_ephemeral=false. The borrower external identifier
            to attach the submission to.
        preparation_type:
          enum:
          - UNQUALIFIED
          - QUALIFIED
          - TAX_RETURN
          - REVIEWED
          - CPA_PREP
          - NTR
          - MANAGEMENT
          - COMBINED
          - UNKNOWN
          - CALCULATED
          - ANALYST
          - UNQUALIFIED_IMPORT
          - QUALIFIED_IMPORT
          - TAX_RETURN_IMPORT
          - REVIEWED_IMPORT
          - CPA_PREP_IMPORT
          - NTR_IMPORT
          - MANAGEMENT_IMPORT
          - ANALYST_IMPORT
          - IMPORTED
          - FORECASTED
          - ANNUALIZED
          type: string
          default: UNQUALIFIED
          description: Financial statement preparation type for the submission. Only
            used when is_ephemeral=false. Defaults to UNQUALIFIED.
      required:
      - orbis_id
    DocumentFileCreate:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        status:
          type: string
          readOnly: true
        created_date:
          type: string
          format: date-time
          readOnly: true
        borrower_uuid:
          type: string
          format: uuid
          description: UUID of the borrower for this file. (see [Borrowers](#tag/Borrowers))
        media_type:
          enum:
          - application/pdf
          - application/x-pdf
          - application/vnd.ms-excel
          - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
          - application/vnd.ms-excel.sheet.macroEnabled.12
          - image/png
          - image/gif
          - image/jpeg
          - application/json
          type: string
          writeOnly: true
          description: '[MIME type](https://developer.mozilla.org/en-US/docs/Glossary/MIME_type)
            of the file'
        filename:
          type: string
          description: Used to reference the original filename. Defaults to `document.{MEDIA
            TYPE FILE EXTENSION}` e.g. fye_2026.pdf
          maxLength: 200
        statements:
          type: array
          items:
            type: object
            properties:
              form_type:
                enum:
                - INCOME_STATEMENT
                - BALANCE_SHEET
                - TAX_RETURN
                - '1065'
                - '1040'
                - '1120'
                - 1120S
                - Puerto Rico Corporate
                - Puerto Rico Individual
                - Puerto Rico Schedule M Individual
                - Puerto Rico Schedule CO Individual
                - Puerto Rico Schedule D Individual
                - Puerto Rico Schedule F Individual
                - Puerto Rico Schedule H Individual
                - Puerto Rico Schedule IE Individual
                - Puerto Rico Schedule J Individual
                - Puerto Rico Schedule K Individual
                - Puerto Rico Schedule L Individual
                - Puerto Rico Schedule N Individual
                - Puerto Rico Schedule R1 Individual
                type: string
              start_date:
                type: string
                format: date
              end_date:
                type: string
                format: date
              tax_year:
                type: integer
                maximum: 2026
                minimum: 1901
          writeOnly: true
          description: "\nBy default, any document submitted to Fincura will be scanned\
            \ for Income Statement and Balance Sheet information.\n\nThe engine can\
            \ also be pointed at Tax Returns by setting a statement object with a\
            \ `form_type` and `tax_year`. Supported tax form types: \n\n```\n{\n \
            \   \"borrower_uuid\": \"6e...845ab1d\",\n    \"media_type\": \"application/pdf\"\
            ,\n    \"statements\": [\n        {\n          \"form_type\": \"1065\"\
            \n          \"tax_year\": 2019\n        }\n      ]\n}\n```\n    \n\n"
        upload_url:
          type: string
          format: uri
          readOnly: true
          maxLength: 2500
          pattern: "^(?:[a-z0-9.+-]*)://(?:[^\\s:@/]+(?::[^\\s:@/]*)?@)?(?:(?:0|25[0-5]|2[0-4][0-9]|1[0-9]?[0-9]?|[1-9][0-9]?)(?:\\\
            .(?:0|25[0-5]|2[0-4][0-9]|1[0-9]?[0-9]?|[1-9][0-9]?)){3}|\\[[0-9a-f:.]+\\\
            ]|([a-z\xA1-\uFFFF0-9](?:[a-z\xA1-\uFFFF0-9-]{0,61}[a-z\xA1-\uFFFF0-9])?(?:\\\
            .(?!-)[a-z\xA1-\uFFFF0-9-]{1,63}(?<!-))*\\.(?!-)(?:[a-z\xA1-\uFFFF-]{2,63}|xn--[a-z0-9]{1,59})(?<!-)\\\
            .?|localhost))(?::[0-9]{1,5})?(?:[/?#][^\\s]*)?\\z"
        external_id:
          type: string
          description: External ID is used to uniquely identify a record from your
            system in our system. Must be unique across records.
          maxLength: 255
        custom_attributes:
          type: object
        document_type:
          enum:
          - INCOME_STATEMENT
          - BALANCE_SHEET
          - TAX_RETURN
          type: string
          default: TAX_RETURN
      required:
      - borrower_uuid
      - media_type
