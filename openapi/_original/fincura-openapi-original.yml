        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - name: borrower_uuid
        required: false
        in: query
        description: Borrower to filter results for
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - count
                - results
                properties:
                  count:
                    type: integer
                    example: 123
                  next:
                    type: string
                    nullable: true
                    format: uri
                    example: http://api.example.org/accounts/?offset=400&limit=100
                  previous:
                    type: string
                    nullable: true
                    format: uri
                    example: http://api.example.org/accounts/?offset=200&limit=100
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/DocumentFileRead'
          description: ''
      tags:
      - Files
      summary: List DocumentFile records
    post:
      operationId: createDocumentFile
      description: "Add a new file to Fincura for processing.\n\nThe minimal document\
        \ creation request requires just a `borrower_uuid` and the `media_type` of\
        \ the file to process.\n\n\n    POST /v1/document-file HTTP/1.1\n    Host:\
        \ api.amer.spreading.moodysanalytics.com\n    Accept: application/json\n \
        \   Authorization: Bearer eyJ0e...nFTRKTbcg\n    Content-Type: application/json\n\
        \n    {\n        \"borrower_uuid\": \"6e64724a-25fc-4e1a-8071-1ef29845ab1d\"\
        ,\n        \"media_type\": \"application/pdf\"\n    }\n    \n\nThe above request\
        \ will create a new document record in Fincura and return a url to send the\
        \ file to, as seen below.\n\n    {\n        \"uuid\": \"f67a21dd-32a0-4664-9cd4-4181640be400\"\
        ,\n        \"upload_url\": \"https://upload.fincura.com/f67a21dd-32a0-4664-9cd4-4181640be400/document.pdf?signature=mWFg4xsgm4EtFEt\"\
        \n    }\n\nIn a subsequent request, the file can be sent to the `upload_url`\
        \ via [HTTP PUT](https://developer.mozilla.org/en-US/docs/Web/HTTP/Methods/PUT).\
        \ The `Content-Length` and `Content-Type` headers are required. The `Content-Type`\
        \ should match the `media_type` from the previous request.\n\n    PUT /f67a21dd-32a0-4664-9cd4-4181640be400/document.pdf?signature=mWFg4xsgm4EtFEt\
        \ HTTP/1.1\n    Host: upload.fincura.com\n    Content-Length: 18828\n    Content-Type:\
        \ application/pdf\n    \n    {FILE  DATA}\n\nFincura will begin processing\
        \ the file once it has been completely uploaded.\n\nAdditional fields described\
        \ below:"
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentFileCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DocumentFileCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DocumentFileCreate'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentFileCreate'
          description: ''
        429:
          content:
            application/json:
              schema:
                properties:
                  details:
                    type: string
                    example: Request was throttled. Expected available in 35 seconds.
          description: Rate Limit
      tags:
      - Files
      summary: Submit a new DocumentFile
