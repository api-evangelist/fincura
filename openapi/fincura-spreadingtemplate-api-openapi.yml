openapi: 3.0.2
info:
  title: Automated Spreading and Analysis Api-Key SpreadingTemplate API
  version: 1.3.1
  description: "This [REST API](https://en.wikipedia.org/wiki/Representational_state_transfer) allows you to interact with the Automated Spreading processing and insights engine. \n\n# Authentication\n\nThis API uses API keys generated from a Automated Spreading User account. To get access to your User account, speak with your Automated Spreading account manager.\n\n# Accepted Media Types\n\n| File&nbsp;Type&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; | Extension(s)     | Content-Type(s) |\n| -------------------------------- |-------------- | ------------ |\n| PDF File | .pdf | `application/pdf` , `application/x-pdf` |\n| Excel File | .xls | `application/vnd.ms-excel`  |\n| Excel File | .xlsx | `application/vnd.openxmlformats-officedocument.spreadsheetml.sheet`  |\n| Excel File | .xlsm | `application/vnd.ms-excel.sheet.macroEnabled.12`  |\n| PNG Image | .png | `image/png`  |\n| GIF Image | .gif | `image/gif`  |\n| JPG Image | .jpg, .jpeg | `image/jpeg`  |\n| GIF Image | .gif | `image/gif`  |\n| JSON File | .json | `application/json`  |\n\n\n# Getting Started\n\n1. [Create a Borrower](#operation/createBorrower) \n2. [Add a file](#operation/createDocumentFile) for that Borrower.\n3. Analyze in the Automated Spreading App\n\n****"
  x-logo:
    url: https://manual-public-web-static-resources.s3.amazonaws.com/public-api/Moodys-icon.svg
  contact:
    name: Moody's Automated Spreading Customer Support
    email: MA_NMR_Support@moodys.com
security:
- API_Key: []
tags:
- name: SpreadingTemplate
  description: Spreading Templates
paths:
  /v1/template/spreading:
    get:
      operationId: listSpreadingTemplates
      description: List Spreading templates
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - count
                - results
                properties:
                  count:
                    type: integer
                    example: 123
                  next:
                    type: string
                    nullable: true
                    format: uri
                    example: http://api.example.org/accounts/?offset=400&limit=100
                  previous:
                    type: string
                    nullable: true
                    format: uri
                    example: http://api.example.org/accounts/?offset=200&limit=100
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/TemplateRead'
          description: ''
      tags:
      - SpreadingTemplate
      summary: List Spreading Templates
  /v1/template/spreading/{uuid}:
    get:
      operationId: retrieveSpreadingTemplate
      description: Retrieve a Borrower
      parameters:
      - name: uuid
        in: path
        required: true
        description: ''
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateRetrieve'
          description: ''
      tags:
      - SpreadingTemplate
      summary: Get Spreading Template with Flattened Taxonomy Items
components:
  schemas:
    TemplateRetrieve:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        template_type:
          type: string
          readOnly: true
          default: STANDARD
        name:
          type: string
          readOnly: true
        is_default:
          type: boolean
          readOnly: true
        created_date:
          type: string
          format: date-time
          readOnly: true
        active:
          type: boolean
          readOnly: true
        template_items:
          type: string
          readOnly: true
    TemplateRead:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        template_type:
          type: string
          readOnly: true
          default: STANDARD
        name:
          type: string
          readOnly: true
        is_default:
          type: boolean
          readOnly: true
        created_date:
          type: string
          format: date-time
          readOnly: true
        active:
          type: boolean
          readOnly: true
  securitySchemes:
    API_Key:
      type: http
      scheme: bearer
      bearerFormat: JWT
x-tagGroups:
- name: Tenant
  tags:
  - Api-Key
  - TenantSettings
- name: Templates
  tags:
  - SpreadingTemplate
  - DscrTemplate
  - GlobalCashflowTemplate
- name: Borrower
  tags:
