                type: boolean
                default: false
                description: Used to designate the entity as the primary entity of the analysis
              is_blank_entity:
                type: boolean
                default: false
                description: Set to true if you wish to include the borrower in the analysis without adding any spread periods for the borrower
              periods_to_include:
                type: array
                items:
                  type: object
                  properties:
                    value:
                      type: string
                    label:
                      type: string
                    interval:
                      type: string
                    year:
                      type: integer
                    interval_index:
                      type: integer
                    preparation_type:
                      type: string
                    fiscal_year_end:
                      type: string
                    scenario:
                      type: string
                    projection_name:
                      type: string
                    period_key_uuid:
                      type: string
                    currency_format:
                      type: string
                  required:
                  - value
                  - label
                  - interval
                  - year
                  - interval_index
                  - preparation_type
                  - fiscal_year_end
                  - scenario
                default: []
              open_tradelines:
                type: array
                items:
                  type: object
                  properties:
                    display_name:
                      type: string
                      description: The name to be displayed for the tradeline
                    tradeline_type:
                      type: string
                      description: The category of the tradeline
                    revolving_or_installment:
                      enum:
                      - revolving
                      - installment
                      type: string
                      description: The type of the tradeline. Can either be revolving or an installment
                    tradeline_installment_monthly_amount:
                      type: integer
                      nullable: true
                      description: for installment payments, the monthly installment amount
                    tradeline_revolving_amount:
                      type: integer
                      nullable: true
                      description: for revolving type tradelines, the total available amount or outstanding balance
                  required:
                  - display_name
                  - tradeline_type
                  - revolving_or_installment
                default: []
            required:
            - borrower_uuid
        commentary:
          type: string
          readOnly: true
          nullable: true
          description: The commentary associated with a given GCF Analysis. This will will be `null` if not commentary exists
        external_user_id:
          type: string
          writeOnly: true
        external_user_label:
          type: string
          writeOnly: true
      required:
      - analysis_name
      - borrower_uuid
      - entities_to_include
    GlobalCashflowAnalysis:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        created_date:
          type: string
          format: date-time
          readOnly: true
        analysis_name:
          type: string
        borrower_uuid:
          type: string
          format: uuid
          description: UUID of the Borrower for this analysis
        template_uuid:
          type: string
          format: uuid
          description: UUID of the template to use for the analysis.
      required:
      - analysis_name
      - borrower_uuid
  securitySchemes:
    API_Key:
      type: http
      scheme: bearer
      bearerFormat: JWT
