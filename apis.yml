aid: fincura
name: Fincura
description: >-
  Fincura (now part of Abrigo) provides automated financial statement spreading and
  credit analysis for banks, credit unions, and other lenders. Its Automated Spreading
  and Analysis API ingests borrower financial documents (PDF, Excel, and images),
  spreads them into normalized data views, and runs debt-service-coverage-ratio (DSCR)
  and global cashflow analyses. The REST API (v1) covers borrowers, loans, portfolios,
  document files, data views, spreading/DSCR/global-cashflow templates, financial
  requirements, custom attributes, embeddable workflow UIs, and HMAC-signed webhooks.
  Authentication is a bearer JWT API key issued per Fincura user account. Originally a
  Techstars-backed startup, Fincura was acquired by Abrigo.
